[project]
name = "finsight-ai"
version = "0.1.0"
description = "Agentic AI assistant with multi-source RAG for financial intelligence"
requires-python = ">=3.11"

dependencies = [
    # Agentic framework
    "crewai>=0.80.0",
    "crewai-tools>=0.20.0",
    # LangChain core + integrations
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-pinecone>=0.2.0",
    "langchain-huggingface>=0.1.0",
    # LangGraph
    "langgraph>=0.2.0",
    # LLM providers
    "groq>=0.9.0",
    "openai>=1.30.0",
    "litellm>=1.40.0",
    # Embeddings
    "voyageai>=0.2.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.23.0",
    # Vector store
    "pinecone-client>=4.0.0",
    # PDF loading
    "pdfplumber>=0.11.0",
    # Data handling
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    # Database
    "duckdb>=1.0.0",
    # UI
    "streamlit>=1.35.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "pypdf>=4.0.0",
]
